[project]
name = "weil-adk-pr-agent"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache License 2.0"}

dependencies = [
    "google-adk[gcp,otel-gcp]<3.0.0,>=2.6.0",
    "litellm>=1.84,<1.106.3",
    "weil-ai>=0.1.1",
    "weil-wallet>=0.1.1",
    "requests>=2.32.0",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.0.0",
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.13.4",
    "gcsfs>=2024.11.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "google-cloud-aiplatform[agent-engines]>=1.156.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true
