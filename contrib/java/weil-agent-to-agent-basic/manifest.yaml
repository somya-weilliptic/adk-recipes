type: "standalone"    # Options: [standalone | module]
status: "active"      # Options: [active | inactive]
language: "java"      # Options: [python | java | go | kotlin | typescript]
deployable: true
description: "A root agent that rolls dice locally and asks the remote prime agent (`a2a_server`) over A2A which rolls are prime, with a Weil wallet identity: steps audited on chain and tools gated by on-chain permissions."

architecture:
  agent: "multi"       # Options: [single | multi]
  stateful: true       # Options: [true | false]
  datasources:         # Options: [hardcoded | local | external]
    - "external"

dependencies:
  libraries:
    - "ADK"
    - "Weil Wallet SDK"
  services:
    - "Weilliptic Sentinel"
    - "Anthropic API"
    - "OpenAI API"

ownership:
  team: "weilliptic"
  poc: "FILL-IN-GITHUB-HANDLE"

tags:
  - "weilliptic"
  - "audit"
  - "permissions"
  - "a2a"
  - "multi-agent"

license: "Apache-2.0"
