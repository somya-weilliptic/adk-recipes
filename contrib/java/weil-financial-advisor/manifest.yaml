type: "standalone"    # Options: [standalone | module]
status: "active"      # Options: [active | inactive]
language: "java"      # Options: [python | java | go | kotlin | typescript]
deployable: true
description: "A coordinator that analyses a stock ticker with four specialist agents: data analysis (web search), trading strategies, an execution plan and a risk assessment, with a Weil wallet identity: steps audited on chain and tools gated by on-chain permissions."

architecture:
  agent: "multi"       # Options: [single | multi]
  stateful: false       # Options: [true | false]
  datasources:         # Options: [hardcoded | local | external]
    - "external"

dependencies:
  libraries:
    - "ADK"
    - "Weil Wallet SDK"
  services:
    - "Weilliptic Sentinel"
    - "Anthropic API"
    - "OpenAI API"

ownership:
  team: "weilliptic"
  poc: "FILL-IN-GITHUB-HANDLE"

tags:
  - "weilliptic"
  - "audit"
  - "permissions"
  - "multi-agent"
  - "agent-tool"
  - "finance"
  - "web-search"

license: "Apache-2.0"
