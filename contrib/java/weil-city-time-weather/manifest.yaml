type: "standalone"    # Options: [standalone | module]
status: "active"      # Options: [active | inactive]
language: "java"      # Options: [python | java | go | kotlin | typescript]
deployable: true
description: "An agent that tells the current time and the weather in a city, with a Weil wallet identity: steps audited on chain and tools gated by on-chain permissions."

architecture:
  agent: "single"       # Options: [single | multi]
  stateful: true       # Options: [true | false]
  datasources:         # Options: [hardcoded | local | external]
    - "hardcoded"

dependencies:
  libraries:
    - "ADK"
    - "Weil Wallet SDK"
  services:
    - "Weilliptic Sentinel"
    - "Anthropic API"
    - "OpenAI API"

ownership:
  team: "weilliptic"
  poc: "FILL-IN-GITHUB-HANDLE"

tags:
  - "weilliptic"
  - "audit"
  - "permissions"
  - "quickstart"
  - "tools"

license: "Apache-2.0"
