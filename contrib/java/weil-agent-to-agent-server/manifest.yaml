type: "standalone"    # Options: [standalone | module]
status: "active"      # Options: [active | inactive]
language: "java"      # Options: [python | java | go | kotlin | typescript]
deployable: true
description: "An agent that checks whether numbers are prime, served to other agents over A2A on port 8003. `a2a_basic` calls it, with a Weil wallet identity: steps audited on chain and tools gated by on-chain permissions."

architecture:
  agent: "single"       # Options: [single | multi]
  stateful: false       # Options: [true | false]
  datasources:         # Options: [hardcoded | local | external]
    - "hardcoded"

dependencies:
  libraries:
    - "ADK"
    - "Weil Wallet SDK"
  services:
    - "Weilliptic Sentinel"
    - "Anthropic API"
    - "OpenAI API"

ownership:
  team: "weilliptic"
  poc: "FILL-IN-GITHUB-HANDLE"

tags:
  - "weilliptic"
  - "audit"
  - "permissions"
  - "a2a"
  - "server"

license: "Apache-2.0"
