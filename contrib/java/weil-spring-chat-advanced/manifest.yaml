type: "standalone"    # Options: [standalone | module]
status: "active"      # Options: [active | inactive]
language: "java"      # Options: [python | java | go | kotlin | typescript]
deployable: true
description: "A Spring Boot customer-support chat that streams its answers and runs its order and shipping tools in parallel, with a Weil wallet identity: steps audited on chain and tools gated by on-chain permissions."

architecture:
  agent: "single"       # Options: [single | multi]
  stateful: true       # Options: [true | false]
  datasources:         # Options: [hardcoded | local | external]
    - "hardcoded"

dependencies:
  libraries:
    - "ADK"
    - "Weil Wallet SDK"
    - "Spring Boot"
  services:
    - "Weilliptic Sentinel"
    - "Anthropic API"
    - "OpenAI API"

ownership:
  team: "weilliptic"
  poc: "FILL-IN-GITHUB-HANDLE"

tags:
  - "weilliptic"
  - "audit"
  - "permissions"
  - "spring-boot"
  - "web"
  - "streaming"

license: "Apache-2.0"
